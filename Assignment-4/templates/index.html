<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Data</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: #b00020; background: #ffe6e6; padding: 12px; border-radius: 4px; margin-top: 20px; }
        .nav { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; }
        .nav a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Submit Your Data</h1>

    {% if error %}
        <div class="error">Error: {{ error }}</div>
    {% endif %}

    <form action="/submit" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <button type="submit">Submit</button>
    </form>

    <div class="nav">
        <p>View the Task 1 API: <a href="/api">/api</a></p>
    </div>
</body>
</html>
