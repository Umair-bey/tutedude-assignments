<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do Page</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1e7e34; }
        .nav { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; }
        .nav a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Add To-Do Item</h1>
    <form action="/submittodotitem" method="POST">
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>

        <label for="itemDescription">Item Description:</label>
        <textarea id="itemDescription" name="itemDescription" placeholder="Enter item description" required></textarea>

        <button type="submit">Add Item</button>
    </form>

    <div class="nav">
        <p><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
